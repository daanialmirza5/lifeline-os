name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AUTH_SECRET: ci-test-secret-not-for-production
  AI_PROVIDER: mock

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck, unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: Set up and seed database for the evaluation harness
        run: |
          npm run db:bootstrap
          npm run db:seed
        env:
          DATABASE_URL: file:./dev.db

      - name: Evaluation harness
        run: npm run evaluate
        env:
          DATABASE_URL: file:./dev.db

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Bootstrap database (for build-time data needs, if any)
        run: npm run db:bootstrap

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./dev.db

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Set up and seed database
        run: |
          npm run db:bootstrap
          npm run db:seed
        env:
          DATABASE_URL: file:./dev.db

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: file:./dev.db
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
